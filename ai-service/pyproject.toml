[project]
name = "isml-ai-service"
version = "0.1.0"
description = "ISML Resource Platform AI Service with FastAPI and PydanticAI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "ISML AI Engineering Team", email = "ai@isml.org" }
]
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pydantic-ai>=0.0.14,<1.0.0",
    "httpx>=0.27.0,<0.29.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
